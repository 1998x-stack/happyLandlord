name: Main CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run unit tests
      run: |
        python -m unittest test_happy_landlord -v
        
    - name: Import all modules test
      run: |
        python -c "
        print('Testing all module imports...')
        from environment import LandlordEnv2v2
        from agent import DQNAgent
        from network import DouZeroNet
        from trainer import Trainer
        from config import Config
        from memory import ReplayMemory, TeamMemory
        from utils import set_seed, init_logging
        print('✓ All modules imported successfully')
        "
        
    - name: Quick functionality test
      run: |
        python -c "
        print('Testing basic functionality...')
        from environment import LandlordEnv2v2
        from config import Config
        
        # Quick environment test
        env = LandlordEnv2v2(seed=42)
        state = env.reset()
        print(f'✓ Environment: {state.shape}')
        
        # Test legal actions
        legal_actions = env.get_legal_actions()
        print(f'✓ Legal actions: {len(legal_actions)} available')
        
        # Quick step test
        next_state, reward, done, info = env.step(0)  # PASS action
        print(f'✓ Step executed: reward={reward}, done={done}')
        
        print('✓ Basic functionality test passed!')
        "
        
    - name: Network test
      run: |
        python -c "
        print('Testing neural network...')
        from network import DouZeroNet
        import torch
        
        net = DouZeroNet(Config.STATE_SHAPE, 10)
        sample_input = torch.randn(1, *Config.STATE_SHAPE)
        output = net(sample_input)
        print(f'✓ Network forward pass: {output.shape}')
        print('✓ Network test passed!')
        "
        
    - name: Agent test
      run: |
        python -c "
        print('Testing DQN agent...')
        from agent import DQNAgent
        import numpy as np
        
        agent = DQNAgent(Config.STATE_SHAPE, 10)
        print('✓ Agent created')
        
        # Test action selection
        state = np.random.rand(*Config.STATE_SHAPE).astype(np.float32)
        legal_actions = [0, 1, 2]
        action = agent.select_action(state, legal_actions, epsilon=0.1)
        print(f'✓ Action selected: {action}')
        print('✓ Agent test passed!')
        "
        
    - name: Short training test
      run: |
        timeout 45s python -c "
        print('Testing trainer initialization...')
        from trainer import Trainer
        import sys
        
        trainer = Trainer(device='cpu')
        print('✓ Trainer initialized successfully')
        
        # Run a partial episode
        print('Starting partial training episode...')
        trainer.train_episode()
        print('✓ Partial training test completed successfully!')
        " || echo "Training test completed or timed out"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics