name: Test Happy Landlord

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run unit tests
      run: |
        python -m unittest test_happy_landlord -v
        
    - name: Run basic functionality test
      run: |
        python -c "
        from environment import LandlordEnv2v2
        from agent import DQNAgent
        from trainer import Trainer
        from config import Config
        
        # Test environment
        env = LandlordEnv2v2(seed=42)
        state = env.reset()
        print(f'Environment test passed: state shape {state.shape}')
        
        # Test agent
        agent = DQNAgent(Config.STATE_SHAPE, 10)
        print('Agent test passed')
        
        # Test network
        from network import DouZeroNet
        net = DouZeroNet(Config.STATE_SHAPE, 10)
        import torch
        sample_input = torch.randn(1, *Config.STATE_SHAPE)
        output = net(sample_input)
        print(f'Network test passed: output shape {output.shape}')
        
        print('Basic functionality tests completed successfully!')
        "
        
    - name: Run short training test
      run: |
        timeout 60s python -c "
        from trainer import Trainer
        from loguru import logger
        import sys
        
        # Reduce logging for CI
        logger.remove()
        logger.add(sys.stdout, level='WARNING')
        
        trainer = Trainer(device='cpu')
        trainer.train_episode()
        print('Short training test completed successfully!')
        " || echo "Training test timed out or completed"